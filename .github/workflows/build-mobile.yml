name: Build DSH Mobile APK

on:
  push:
    branches: [ master ]
    paths:
      - 'dsh-mobile/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        run: |
          printf "%s" "${{ secrets.SIGNING_KEY_B64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        working-directory: dsh-mobile
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: dsh-mobile
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Read versionName/versionCode
        id: ver
        working-directory: dsh-mobile
        run: |
          NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-${{ steps.ver.outputs.name }}
          path: dsh-mobile/app/build/outputs/apk/release/app-release.apk
